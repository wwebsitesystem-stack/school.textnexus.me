<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Assistant - Nexus OS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0c0d0e;
            color: #e1e4e8;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #16181a;
            border: 1px solid #23272b;
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #23272b;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .badge {
            background-color: #102a1d;
            color: #2ed573;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #1a4d31;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #9da5b4;
            margin-bottom: 8px;
        }

        textarea, input, select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 20px;
            background-color: #0c0d0e;
            border: 1px solid #282c34;
            border-radius: 8px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus, input:focus, select:focus {
            border-color: #2ed573;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background-color: #0c0d0e;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #282c34;
        }

        .radio-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: #e1e4e8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="radio"] {
            width: auto;
            margin-bottom: 0;
            accent-color: #2ed573;
        }

        button {
            background-color: #2ed573;
            color: #0c0d0e;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            width: 100%;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #26af5f;
        }

        button:active {
            transform: scale(0.99);
        }

        .status-title {
            margin-top: 24px;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6c757d;
        }

        #response {
            white-space: pre-wrap;
            background-color: #0c0d0e;
            border: 1px solid #282c34;
            color: #a9b2b7;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            min-height: 60px;
            line-height: 1.5;
        }
    </style>

    <!-- Firebase Modular Web SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official",
            storageBucket: "nexus-web-development-official.firebasestorage.app",
            messagingSenderId: "553556577139",
            appId: "1:553556577139:web:67c4aebebb033acf999306",
            measurementId: "G-5M518HQEX4"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.allFirebaseEmails = [];

        // Load users from Realtime Database
        async function loadUsers() {
            const userSelect = document.getElementById('userSelect');
            try {
                const snapshot = await get(ref(database, 'users'));
                userSelect.innerHTML = '';
                window.allFirebaseEmails = [];

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let key in data) {
                        const email = data[key].email || (typeof data[key] === 'string' ? data[key] : null);
                        if (email) {
                            window.allFirebaseEmails.push(email);
                            const option = document.createElement('option');
                            option.value = email;
                            option.textContent = data[key].name ? `${data[key].name} (${email})` : email;
                            userSelect.appendChild(option);
                        }
                    }
                }

                if (window.allFirebaseEmails.length === 0) {
                    userSelect.innerHTML = '<option value="">No users found in database</option>';
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                userSelect.innerHTML = '<option value="">Error loading users</option>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>AI Customer Email Assistant</h2>
        <span class="badge">Nexus OS</span>
    </div>

    <label for="senderSelect">Send From Address</label>
    <select id="senderSelect">
        <option value="support@textnexus.me">support@textnexus.me</option>
        <option value="owner@textnexus.me">owner@textnexus.me</option>
    </select>

    <label>Recipient Mode</label>
    <div class="radio-group">
        <label><input type="radio" name="sendTarget" value="single" checked onclick="toggleRecipientMode()"> Specific User</label>
        <label><input type="radio" name="sendTarget" value="all" onclick="toggleRecipientMode()"> Send to Everyone</label>
    </div>

    <div id="singleUserContainer">
        <label for="userSelect">Select Customer</label>
        <select id="userSelect">
            <option value="">Loading users from Firebase...</option>
        </select>
    </div>

    <label for="prompt">AI Instructions / Email Content Prompt</label>
    <textarea id="prompt" rows="4" placeholder="e.g., Thank the customer for reaching out and inform them that their ticket is resolved."></textarea>

    <button onclick="generateAndSend()">Generate & Send Email</button>

    <div class="status-title">System Status / Output</div>
    <div id="response">Ready...</div>
</div>

<script>
    function toggleRecipientMode() {
        const sendTarget = document.querySelector('input[name="sendTarget"]:checked').value;
        const container = document.getElementById('singleUserContainer');
        container.style.display = (sendTarget === 'single') ? 'block' : 'none';
    }

    async function generateAndSend() {
        const promptText = document.getElementById('prompt').value;
        const selectedSender = document.getElementById('senderSelect').value;
        const sendTarget = document.querySelector('input[name="sendTarget"]:checked').value;
        const outputDiv = document.getElementById('response');

        let recipientEmails = [];

        if (sendTarget === 'single') {
            const singleEmail = document.getElementById('userSelect').value;
            if (!singleEmail) {
                outputDiv.innerText = "Please select a user email.";
                return;
            }
            recipientEmails.push(singleEmail);
        } else {
            if (!window.allFirebaseEmails || window.allFirebaseEmails.length === 0) {
                outputDiv.innerText = "No user emails loaded from Firebase.";
                return;
            }
            recipientEmails = window.allFirebaseEmails;
        }

        outputDiv.innerText = `Processing AI and sending to ${recipientEmails.length} recipient(s)...`;

        try {
            const response = await fetch('https://emailsendercloudflareworker.textnexus.me', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: promptText,
                    emails: recipientEmails,
                    sender: selectedSender
                })
            });

            const result = await response.json();

            if (result.success) {
                outputDiv.innerText = `Successfully dispatched email to ${result.count} recipient(s)!\n\nAI Message:\n${result.reply}`;
            } else {
                outputDiv.innerText = "Error: " + (result.error || "Failed to process request.");
            }
        } catch (error) {
            outputDiv.innerText = "Connection Error: " + error.message;
        }
    }
</script>

</body>
</html>
