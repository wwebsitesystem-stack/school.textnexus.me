<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Manager - Nexus OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #000; color: #fff; padding: 30px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        h2 { font-size: 18px; font-weight: 600; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-top: 16px; }
        select, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        select:focus, textarea:focus { border-color: #2ed573; }
        .radio-group { display: flex; gap: 20px; background: #000; padding: 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; margin-top: 8px; }
        .radio-group label { margin: 0; color: #fff; text-transform: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        input[type="radio"] { accent-color: #2ed573; }
        button { margin-top: 24px; width: 100%; padding: 14px; background: #2ed573; color: #000; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #26af5f; }
        #response { margin-top: 20px; background: #000; border: 1px solid rgba(255,255,255,0.12); padding: 16px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #aaa; white-space: pre-wrap; min-height: 80px; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com",
            projectId: "nexus-web-development-official",
            storageBucket: "nexus-web-development-official.firebasestorage.app",
            messagingSenderId: "553556577139",
            appId: "1:553556577139:web:67c4aebebb033acf999306",
            measurementId: "G-5M518HQEX4"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.allFirebaseEmails = [];

        async function loadFirebaseUsers() {
            const userSelect = document.getElementById('userSelect');
            try {
                // Pointing to your textnexus users node based on your rules structure
                const snapshot = await get(ref(database, 'textnexus/users'));
                userSelect.innerHTML = '';
                window.allFirebaseEmails = [];

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let uid in data) {
                        const email = data[uid].email;
                        if (email) {
                            window.allFirebaseEmails.push(email);
                            const option = document.createElement('option');
                            option.value = email;
                            option.textContent = data[uid].name ? `${data[uid].name} (${email})` : email;
                            userSelect.appendChild(option);
                        }
                    }
                }

                if (window.allFirebaseEmails.length === 0) {
                    userSelect.innerHTML = '<option value="">No emails found in textnexus/users</option>';
                }
            } catch (err) {
                console.error("Firebase error:", err);
                userSelect.innerHTML = '<option value="">Error connecting to Firebase database</option>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadFirebaseUsers);
    </script>
</head>
<body>

<div class="container">
    <h2>AI Customer Email Dispatcher</h2>

    <label for="senderSelect">Send From Address</label>
    <select id="senderSelect">
        <option value="support@textnexus.me">support@textnexus.me</option>
        <option value="owner@textnexus.me">owner@textnexus.me</option>
    </select>

    <label>Target Audience</label>
    <div class="radio-group">
        <label><input type="radio" name="sendTarget" value="single" checked onclick="toggleMode()"> Specific User</label>
        <label><input type="radio" name="sendTarget" value="all" onclick="toggleMode()"> Send to Everyone</label>
    </div>

    <div id="singleUserBox" style="margin-top: 16px;">
        <label for="userSelect">Select Customer Email</label>
        <select id="userSelect">
            <option value="">Loading users from Firebase...</option>
        </select>
    </div>

    <label for="prompt">AI Instructions / Template Prompt</label>
    <textarea id="prompt" rows="4" placeholder="e.g., Send an update notifying users about system maintenance tonight."></textarea>

    <button onclick="dispatchEmails()">Generate & Dispatch Emails</button>

    <label style="margin-top: 24px;">Execution Status & AI Output</label>
    <div id="response">System standing by...</div>
</div>

<script>
    function toggleMode() {
        const mode = document.querySelector('input[name="sendTarget"]:checked').value;
        document.getElementById('singleUserBox').style.display = (mode === 'single') ? 'block' : 'none';
    }

    async function dispatchEmails() {
        const promptText = document.getElementById('prompt').value;
        const sender = document.getElementById('senderSelect').value;
        const mode = document.querySelector('input[name="sendTarget"]:checked').value;
        const output = document.getElementById('response');

        let recipients = [];
        if (mode === 'single') {
            const email = document.getElementById('userSelect').value;
            if (!email) {
                output.innerText = "Error: Please select a target user email.";
                return;
            }
            recipients.push(email);
        } else {
            if (!window.allFirebaseEmails || window.allFirebaseEmails.length === 0) {
                output.innerText = "Error: No user emails available to broadcast.";
                return;
            }
            recipients = window.allFirebaseEmails;
        }

        output.innerText = `Running Workers AI and dispatching to ${recipients.length} recipient(s)...`;

        try {
            const res = await fetch('https://emailsendercloudflareworker.textnexus.me', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: promptText,
                    emails: recipients,
                    sender: sender
                })
            });

            const data = await res.json();
            if (data.success) {
                output.innerText = `Success! Sent to ${data.count} user(s).\n\nAI Generated Message:\n${data.reply}`;
            } else {
                output.innerText = "Dispatch Error: " + (data.error || "Unknown error");
            }
        } catch (err) {
            output.innerText = "Network Error: " + err.message;
        }
    }
</script>

</body>
</html>
