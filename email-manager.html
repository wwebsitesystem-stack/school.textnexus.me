<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS - AI Email Manager & Dispatcher</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">
    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header -->
        <div class="glass-card p-6 rounded-2xl flex items-center justify-between shadow-xl">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">AI Customer Email Manager</h1>
                <p class="text-slate-400 text-sm mt-1">Nexus OS Dispatcher • Powered by Workers AI & Firebase</p>
            </div>
            <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Firebase Connected</span>
            </div>
        </div>

        <!-- Main Form & Controls -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Left Panel: Audience & Prompt -->
            <div class="glass-card p-6 rounded-2xl md:col-span-2 space-y-5 shadow-xl">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Recipient Target</label>
                    <select id="recipientSelect" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                        <option value="all">🌐 Broadcast to Everyone (All Unique Customers)</option>
                    </select>
                    <p id="recipientCount" class="text-xs text-slate-400 mt-2">Loading unique customer emails from Firebase paths...</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">AI Generation Prompt</label>
                    <textarea id="aiPrompt" rows="5" placeholder="E.g., Write a professional platform update announcement highlighting Nexus OS v2 features and cloud performance upgrades..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-slate-200 focus:outline-none focus:border-cyan-500 transition resize-none"></textarea>
                </div>

                <button id="sendBtn" onclick="handleDispatch()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-cyan-500/20 transition transform active:scale-[0.99] flex items-center justify-center space-x-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    <span id="btnText">Generate & Dispatch AI Email</span>
                </button>
            </div>

            <!-- Right Panel: Live Logs -->
            <div class="glass-card p-6 rounded-2xl flex flex-col justify-between space-y-4 shadow-xl">
                <div>
                    <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">Live Dispatch Logs</h2>
                    <div id="logContainer" class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 h-64 overflow-y-auto font-mono text-xs text-slate-400 space-y-2">
                        <p class="text-cyan-400">[System] Initializing Firebase database listeners...</p>
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-4">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Endpoint:</span>
                        <span class="text-cyan-400 truncate max-w-[150px]">...textnexus.me</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat version for iframe reliability) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        // Replace with your actual Firebase project settings
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.io",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let uniqueEmails = [];

        async function fetchCustomerEmails() {
            const paths = ['textnexus/users', 'nexus/users', 'pinkping/users'];
            const emailSet = new Set();
            const logContainer = document.getElementById('logContainer');

            try {
                for (const path of paths) {
                    const snapshot = await db.ref(path).once('value');
                    const val = snapshot.val();
                    if (val) {
                        Object.values(val).forEach(user => {
                            const email = user.email || user.mail || user.contactEmail;
                            if (email && typeof email === 'string' && email.includes('@')) {
                                emailSet.add(email.trim().toLowerCase());
                            }
                        });
                        logContainer.innerHTML += `<p class="text-emerald-400">[Firebase] Queried: ${path}</p>`;
                    } else {
                        logContainer.innerHTML += `<p class="text-slate-500">[Firebase] Path empty: ${path}</p>`;
                    }
                }

                uniqueEmails = Array.from(emailSet);
                populateDropdown();
                document.getElementById('recipientCount').innerText = `${uniqueEmails.length} unique customer email(s) loaded.`;
                logContainer.innerHTML += `<p class="text-cyan-400">[Ready] Compiled ${uniqueEmails.length} unique destinations.</p>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            } catch (error) {
                console.error("Firebase error:", error);
                logContainer.innerHTML += `<p class="text-red-400">[Error] Database sync failed: ${error.message}</p>`;
            }
        }

        function populateDropdown() {
            const select = document.getElementById('recipientSelect');
            select.innerHTML = `<option value="all">🌐 Broadcast to Everyone (${uniqueEmails.length} Customers)</option>`;
            uniqueEmails.forEach(email => {
                const opt = document.createElement('option');
                opt.value = email;
                opt.textContent = email;
                select.appendChild(opt);
            });
        }

        async function handleDispatch() {
            const promptText = document.getElementById('aiPrompt').value.trim();
            const recipient = document.getElementById('recipientSelect').value;
            const logContainer = document.getElementById('logContainer');
            const sendBtn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');

            if (!promptText) {
                alert('Please enter an AI generation prompt.');
                return;
            }

            if (uniqueEmails.length === 0 && recipient === 'all') {
                alert('No active recipient emails found in database paths.');
                return;
            }

            const targetList = recipient === 'all' ? uniqueEmails : [recipient];

            sendBtn.disabled = true;
            btnText.innerText = 'Processing AI & Dispatching...';
            logContainer.innerHTML += `<p class="text-yellow-400">[Worker] Dispatching to ${targetList.length} address(es)...</p>`;
            logContainer.scrollTop = logContainer.scrollHeight;

            try {
                const response = await fetch('https://emailsendercloudflareworker.textnexus.me', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptText,
                        recipients: targetList
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    logContainer.innerHTML += `<p class="text-emerald-400">[Success] Dispatched batch: "${result.subject}"</p>`;
                } else {
                    throw new Error(result.error || 'Server error response');
                }
            } catch (err) {
                console.error(err);
                logContainer.innerHTML += `<p class="text-red-400">[Error] Failed: ${err.message}</p>`;
            } finally {
                sendBtn.disabled = false;
                btnText.innerText = 'Generate & Dispatch AI Email';
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        window.addEventListener('DOMContentLoaded', fetchCustomerEmails);
    </script>
</body>
</html>
