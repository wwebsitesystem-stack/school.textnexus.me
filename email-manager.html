<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS - Email Dispatcher</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #ededed; 
        }
        .nexus-card { 
            background: #121212; 
            border: 1px solid #222222; 
        }
        .nexus-input { 
            background: #181818; 
            border: 1px solid #282828; 
            color: #ffffff;
        }
        .nexus-input:focus {
            border-color: #444444;
            outline: none;
        }
        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center justify-center">
    <div class="w-full max-w-5xl space-y-5">
        
        <!-- Header Panel -->
        <div class="nexus-card p-5 rounded-2xl flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-[#1e1e1e] border border-[#2a2a2a] flex items-center justify-center text-white font-bold text-lg">
                    ⚡
                </div>
                <div>
                    <h1 class="text-lg font-semibold text-white tracking-tight">Nexus Dispatcher</h1>
                    <p class="text-xs text-neutral-500 font-mono-code uppercase tracking-wider">OS // EMAIL MANAGER // v6.0</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Status Indicator (Matches green system online badge) -->
                <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-[#181818] border border-[#262626] text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-neutral-300">Database Synced</span>
                </div>
                <!-- Role Badge (Matches yellow/gold OWNER badge) -->
                <span class="px-2.5 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-400 font-mono-code text-[10px] font-bold tracking-wider uppercase rounded-md">
                    OWNER
                </span>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            
            <!-- Target & AI Prompt Section -->
            <div class="nexus-card p-6 rounded-2xl md:col-span-2 space-y-5">
                <div>
                    <label class="block text-xs font-mono-code uppercase tracking-wider text-neutral-400 mb-2">Recipient Target</label>
                    <select id="recipientSelect" class="nexus-input w-full rounded-xl px-4 py-3 text-sm transition">
                        <option value="all">🌐 Broadcast to Everyone (Loading...)</option>
                    </select>
                    <p id="recipientCount" class="text-xs text-neutral-500 mt-2 font-mono-code">Connecting to Firebase paths...</p>
                </div>

                <div>
                    <label class="block text-xs font-mono-code uppercase tracking-wider text-neutral-400 mb-2">AI Campaign Prompt</label>
                    <textarea id="aiPrompt" rows="5" placeholder="Type prompt (e.g. Write a dark-mode platform update for Nexus OS)..." class="nexus-input w-full rounded-xl p-4 text-sm transition resize-none"></textarea>
                </div>

                <button id="sendBtn" onclick="handleDispatch()" class="w-full py-3.5 bg-white hover:bg-neutral-200 text-black font-semibold rounded-xl transition text-sm flex items-center justify-center space-x-2 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    <span id="btnText">Generate & Dispatch AI Email</span>
                </button>
            </div>

            <!-- Console Log Panel -->
            <div class="nexus-card p-6 rounded-2xl flex flex-col justify-between space-y-4">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-xs font-mono-code uppercase tracking-wider text-neutral-400">System Logs</h2>
                        <span class="text-[10px] font-mono-code text-neutral-600">LIVE</span>
                    </div>
                    <div id="logContainer" class="bg-[#0a0a0a] border border-[#1e1e1e] rounded-xl p-3.5 h-64 overflow-y-auto font-mono-code text-[11px] text-neutral-400 space-y-2">
                        <p class="text-neutral-500">[System] Initializing Nexus OS listener...</p>
                    </div>
                </div>

                <div class="border-t border-[#222222] pt-3 flex items-center justify-between text-[11px] font-mono-code text-neutral-500">
                    <span>STATUS:</span>
                    <span class="text-emerald-400">SECURE CONNECTION</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Integration SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.io",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let uniqueEmails = [];

        async function fetchCustomerEmails() {
            const paths = ['textnexus/users', 'nexus/users', 'pinkping/users'];
            const emailSet = new Set();
            const logContainer = document.getElementById('logContainer');

            try {
                for (const path of paths) {
                    const snapshot = await db.ref(path).once('value');
                    const val = snapshot.val();
                    if (val) {
                        Object.values(val).forEach(user => {
                            const email = user.email || user.mail || user.contactEmail;
                            if (email && typeof email === 'string' && email.includes('@')) {
                                emailSet.add(email.trim().toLowerCase());
                            }
                        });
                        logContainer.innerHTML += `<p class="text-emerald-500/80">[OK] Synced: ${path}</p>`;
                    } else {
                        logContainer.innerHTML += `<p class="text-neutral-600">[NULL] Empty path: ${path}</p>`;
                    }
                }

                uniqueEmails = Array.from(emailSet);
                populateDropdown();
                document.getElementById('recipientCount').innerText = `${uniqueEmails.length} unique targets active across all paths.`;
                logContainer.innerHTML += `<p class="text-amber-400/90">[Ready] ${uniqueEmails.length} recipients indexed.</p>`;
                logContainer.scrollTop = logContainer.scrollHeight;
            } catch (error) {
                console.error("Firebase error:", error);
                logContainer.innerHTML += `<p class="text-red-400">[FAIL] Database error: ${error.message}</p>`;
            }
        }

        function populateDropdown() {
            const select = document.getElementById('recipientSelect');
            select.innerHTML = `<option value="all">🌐 Broadcast to Everyone (${uniqueEmails.length} Users)</option>`;
            uniqueEmails.forEach(email => {
                const opt = document.createElement('option');
                opt.value = email;
                opt.textContent = email;
                select.appendChild(opt);
            });
        }

        async function handleDispatch() {
            const promptText = document.getElementById('aiPrompt').value.trim();
            const recipient = document.getElementById('recipientSelect').value;
            const logContainer = document.getElementById('logContainer');
            const sendBtn = document.getElementById('sendBtn');
            const btnText = document.getElementById('btnText');

            if (!promptText) {
                alert('Please enter an AI prompt.');
                return;
            }

            if (uniqueEmails.length === 0 && recipient === 'all') {
                alert('No emails found in database.');
                return;
            }

            const targetList = recipient === 'all' ? uniqueEmails : [recipient];

            sendBtn.disabled = true;
            btnText.innerText = 'Dispatching Batch...';
            logContainer.innerHTML += `<p class="text-amber-400">[Dispatch] Sending to ${targetList.length} recipient(s)...</p>`;
            logContainer.scrollTop = logContainer.scrollHeight;

            try {
                const response = await fetch('https://emailsendercloudflareworker.textnexus.me', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptText,
                        recipients: targetList
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    logContainer.innerHTML += `<p class="text-emerald-400">[Success] "${result.subject}" sent.</p>`;
                } else {
                    throw new Error(result.error || 'Worker dispatch failed');
                }
            } catch (err) {
                console.error(err);
                logContainer.innerHTML += `<p class="text-red-400">[Error] ${err.message}</p>`;
            } font-mono-code {
                sendBtn.disabled = false;
                btnText.innerText = 'Generate & Dispatch AI Email';
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        }

        window.addEventListener('DOMContentLoaded', fetchCustomerEmails);
    </script>
</body>
</html>
