<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance - Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-[#09090b] text-[#fafafa] h-screen flex items-center justify-center p-4 font-sans selection:bg-blue-500 selection:text-white">
    <div class="bg-[#121215] border border-[#27272a] p-8 rounded-2xl shadow-2xl max-w-md w-full text-center flex flex-col gap-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-amber-500"></div>
        
        <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
            <i class="ph ph-wrench"></i>
        </div>
        
        <div>
            <h1 class="text-lg font-bold">System Maintenance</h1>
            <p class="text-xs text-[#a1a1aa] leading-relaxed mt-1">
                Nexus is currently undergoing scheduled system updates and maintenance. Standard access is temporarily paused.
            </p>
        </div>

        <div class="mt-4 pt-4 border-t border-[#27272a] flex flex-col gap-2.5">
            <p class="text-[11px] text-[#a1a1aa]">Are you an Administrator or Owner?</p>
            <button id="bypass-login-btn" class="w-full py-3 bg-[#18181b] hover:bg-[#27272a] border border-[#27272a] text-xs font-semibold rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                <i class="ph ph-shield-check text-blue-400 text-sm"></i> Admin / Owner Bypass Login
            </button>
            <p id="bypass-error" class="text-[11px] text-red-400 hidden"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref as dbRef, get, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO_ffupJOIMPE9m4ARtaqSzC1vGDkIAco",
            authDomain: "nexus-web-development-official.firebaseapp.com",
            projectId: "nexus-web-development-official",
            databaseURL: "https://nexus-web-development-official-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const OWNER_EMAIL = "brodywilliams0226@gmail.com";
        const bypassError = document.getElementById('bypass-error');

        // Auto-redirect back to main app if maintenance is turned off by admin
        onValue(dbRef(db, 'nexus/system/maintenance'), (snapshot) => {
            if (!snapshot.val()) {
                window.location.href = 'index.html';
            }
        });

        // Admin Bypass Handler
        document.getElementById('bypass-login-btn').addEventListener('click', async () => {
            try {
                bypassError.classList.add('hidden');
                const result = await signInWithPopup(auth, new GoogleAuthProvider());
                const user = result.user;

                if (user.email === OWNER_EMAIL) {
                    window.location.href = 'index.html';
                    return;
                }

                const userSnap = await get(dbRef(db, `nexus/users/${user.uid}/role`));
                const role = userSnap.val();

                if (role === 'Admin' || role === 'Owner') {
                    window.location.href = 'index.html';
                } else {
                    bypassError.textContent = `Access Denied: ${user.email} does not have Admin privileges.`;
                    bypassError.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                bypassError.textContent = "Authentication failed. Please try again.";
                bypassError.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
